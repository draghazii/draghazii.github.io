name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android.keystore

      - name: Show certificate fingerprint
        run: |
          keytool -list -v \
            -keystore android.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep "SHA256:"
      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --manifest=./twa-manifest.json \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias="${{ secrets.KEY_ALIAS }}" \
            --skipPwaValidation
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghazi-apk
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            assetlinks.json
